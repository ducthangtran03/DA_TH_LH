<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi bạn 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#7a2f5c;--pk:#ff7eb6;--pk2:#ff9a8b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;color:var(--ink);font-family:"Baloo 2",ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;
  background:linear-gradient(180deg,#6f63c9 0%,#a58be0 22%,#f0a7d6 48%,#ffd0c4 72%,#ffeec9 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:manipulation;z-index:1}

/* ---------- khung cảnh nền ---------- */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.sun{position:absolute;right:5vw;top:calc(env(safe-area-inset-top,0px) + 3vh);width:clamp(84px,22vw,130px);height:clamp(84px,22vw,130px)}
.sun svg{width:100%;height:100%;overflow:visible}
.sun .rays{transform-origin:60px 60px;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sun::before{content:"";position:absolute;inset:-60%;background:radial-gradient(circle,rgba(255,244,170,.75),rgba(255,244,170,0) 62%)}
.sun svg{position:relative}
.rainbow{--w:min(135vw,780px);position:absolute;left:50%;margin-left:calc(var(--w) * -.5);bottom:18vh;width:var(--w);height:calc(var(--w) * .5);opacity:.6;
  background:radial-gradient(circle calc(var(--w) * .5) at 50% 100%,transparent 60%,#ff9fb8 60% 66%,#ffd29f 66% 72%,#fff3a8 72% 78%,#b8f0c0 78% 84%,#a8d8ff 84% 90%,#d2b8ff 90% 96%,transparent 96%)}
.cloud{position:absolute;left:-30%;width:calc(120px * var(--s));height:calc(40px * var(--s));background:#fff;border-radius:99px;
  box-shadow:0 7px 0 rgba(190,160,235,.35);animation:drift var(--d) linear infinite;animation-delay:var(--dl)}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:45%;height:135%;left:14%;bottom:30%}
.cloud::after{width:36%;height:105%;right:14%;bottom:35%}
@keyframes drift{to{transform:translateX(165vw)}}
.spark{position:absolute;color:#fff;text-shadow:0 0 8px #fff,0 0 14px #ffc2e2;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
.hills{position:absolute;left:0;right:0;bottom:0;height:34vh}
.hills svg{position:absolute;inset:0;width:100%;height:100%}
.flower{position:absolute;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite;filter:drop-shadow(0 3px 2px rgba(80,120,90,.25))}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 20px calc(env(safe-area-inset-bottom,0px) + 12px)}

/* ---------- sân khấu ---------- */
#stage{z-index:2;pointer-events:none;gap:6px;will-change:transform}
#bubble{position:relative;max-width:min(88vw,430px);min-height:92px;display:flex;align-items:center;justify-content:center;
  background:#fff;border:5px solid #ffb3d4;border-radius:36px;padding:16px 24px;
  box-shadow:0 8px 0 #ffb3d4,0 18px 30px rgba(214,84,142,.28);
  opacity:0;transform:scale(.4) translateY(30px);transform-origin:50% 100%;
  transition:opacity .35s,transform .6s cubic-bezier(.34,1.8,.64,1)}
#bubble.on{opacity:1;transform:none}
#bubble::after{content:"";position:absolute;left:50%;bottom:-27px;width:30px;height:30px;background:#fff;
  border-right:5px solid #ffb3d4;border-bottom:5px solid #ffb3d4;border-radius:0 0 12px 0;
  transform:translateX(-50%) rotate(45deg) skew(8deg,8deg);box-shadow:5px 5px 0 #ffb3d4}
#line{margin:0;width:100%;font-size:clamp(23px,6vw,34px);font-weight:800;line-height:1.35;color:var(--ink);white-space:normal;text-align:center;text-wrap:balance;overflow-wrap:normal;word-break:keep-all}
#line .w{display:inline-block;white-space:nowrap}
#line .ch{display:inline-block;opacity:0}
#line .ch.show{animation:chp .35s cubic-bezier(.34,1.8,.64,1) both}
@keyframes chp{from{opacity:0;transform:translateY(10px) scale(.4)}to{opacity:1;transform:none}}

/* ---------- nhân vật gấu ---------- */
#bear{width:min(62vw,270px);margin-top:26px;filter:drop-shadow(0 14px 14px rgba(150,70,120,.28));animation:bob 2.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-8px) scale(1.02,.98)}}
#bear.happy{animation:jump .7s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.06,.94)}45%{transform:translateY(-34px) scale(.96,1.06) rotate(-4deg)}75%{transform:translateY(-12px) rotate(4deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
#eyesHappy,#mouthO,#heart2{display:none}
#bear.happy #eyesOpen{display:none}
#bear.happy #eyesHappy{display:block}
#bear.talk #mouthSmile{display:none}
#bear.talk #mouthO{display:block;animation:talk .28s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes talk{to{transform:scaleY(.45)}}
#bear.happy #mouthO{display:none}
#bear.happy #mouthSmile{display:block}
.arm{transform-box:fill-box;transform-origin:50% 90%}
#armL{animation:wave 1.2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
.blush{animation:blushp 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes blushp{50%{opacity:.55;transform:scale(1.15)}}
.heart{animation:hb 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes hb{0%,100%{transform:scale(1)}20%{transform:scale(1.22)}40%{transform:scale(1)}}

/* ---------- nút ---------- */
button{font:inherit;font-weight:800;color:#fff;cursor:pointer;border-radius:999px;padding:11px 28px;font-size:20px;border:4px solid #fff;
  background:linear-gradient(135deg,var(--pk),var(--pk2));box-shadow:0 6px 0 rgba(214,84,142,.55),0 12px 22px rgba(214,84,142,.3);
  transition:transform .15s,box-shadow .15s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(214,84,142,.55)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#btns{z-index:3;position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);display:flex;justify-content:center;gap:16px;align-items:center;
  opacity:0;pointer-events:none;transition:opacity .6s}
#btns.on{opacity:1;pointer-events:auto}
#yes{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#no{background:linear-gradient(135deg,#b9a6ff,#8fc5ff);box-shadow:0 6px 0 rgba(110,110,200,.5),0 12px 22px rgba(110,110,200,.25);font-size:16px;padding:9px 20px;position:relative}
#no.run{position:fixed}
#again{position:fixed;z-index:4;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:13px;padding:5px 14px;border-width:3px;opacity:0;pointer-events:none;transition:opacity 1s}
#again.on{opacity:.9;pointer-events:auto}

/* ---------- màn mở ---------- */
#start{z-index:6;background:linear-gradient(170deg,#ffe3f1,#efe0ff);transition:opacity .8s;gap:14px}
#start .env{font-size:clamp(80px,26vw,130px);animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 10px 10px rgba(214,84,142,.35))}
#start p{margin:0 0 6px;font-size:clamp(22px,6vw,28px);font-weight:800}
#start small{display:block;font-weight:600;opacity:.7;font-size:15px;margin-top:-4px}

/* ---- thế giới kẹo ngọt ---- */
#scene{--w:min(135vw,780px)}
.dots{position:absolute;inset:0;opacity:.55;
  background-image:radial-gradient(rgba(255,255,255,.9) 5px,transparent 6px),radial-gradient(rgba(255,255,255,.9) 5px,transparent 6px);
  background-size:52px 52px;background-position:0 0,26px 26px;animation:dotmove 26s linear infinite}
@keyframes dotmove{to{background-position:52px 52px,78px 78px}}
.rainbow{opacity:.8}
.cloud{font-size:calc(10px * var(--s));box-shadow:0 7px 0 rgba(255,170,215,.5)}
.cf{position:absolute;left:50%;top:20%;transform:translateX(-50%);width:3.4em;height:2.2em;z-index:1}
.cf i{position:absolute;top:0;width:.72em;height:.98em;border-radius:50%;background:#5b3350}
.cf i:nth-child(1){left:.3em}.cf i:nth-child(2){right:.3em}
.cf i::after{content:"";position:absolute;left:.14em;top:.12em;width:.3em;height:.3em;border-radius:50%;background:#fff}
.cf b{position:absolute;left:50%;top:1.05em;width:.9em;height:.5em;transform:translateX(-50%);border-bottom:.17em solid #5b3350;border-radius:0 0 .9em .9em}
.cf::before,.cf::after{content:"";position:absolute;top:.95em;width:.8em;height:.46em;border-radius:50%;background:#ff9cc4;opacity:.85}
.cf::before{left:-.45em}.cf::after{right:-.45em}
.cloud.still{animation:none;left:calc(50% - var(--w) * .39 - 60px);top:auto;bottom:calc(18vh - 14px);opacity:1}
.cloud.still.r{left:calc(50% + var(--w) * .39 - 60px)}
.hills svg{overflow:hidden}
.bunting{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);height:70px}
.bunting svg{position:absolute;left:0;top:0;width:100%;height:56px}
.flag{position:absolute;transform-origin:50% 0}
.flag .tri{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:28px solid var(--c);
  transform-origin:50% 0;animation:flagsw 2.4s ease-in-out infinite alternate;filter:drop-shadow(0 3px 0 rgba(180,90,140,.2))}
@keyframes flagsw{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.balloon{position:absolute;bottom:-70px;animation:rise linear infinite;filter:drop-shadow(0 4px 3px rgba(150,80,130,.22))}
@keyframes rise{0%{transform:translate(0,0) rotate(-6deg)}25%{transform:translate(18px,-28vh) rotate(6deg)}50%{transform:translate(-14px,-58vh) rotate(-6deg)}75%{transform:translate(16px,-88vh) rotate(5deg)}100%{transform:translate(0,-130vh) rotate(-5deg)}}

/* ---- xứ sở thần tiên ---- */
.rays{position:absolute;inset:0;opacity:.8;
  background:conic-gradient(from 180deg at 88% -8%,transparent 0 6deg,rgba(255,255,255,.3) 6deg 11deg,transparent 11deg 19deg,rgba(255,255,255,.22) 19deg 22deg,transparent 22deg 33deg,rgba(255,255,255,.26) 33deg 40deg,transparent 40deg 52deg,rgba(255,255,255,.2) 52deg 56deg,transparent 56deg);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 78%);mask-image:linear-gradient(180deg,#000 0%,transparent 78%);animation:raypulse 6s ease-in-out infinite alternate}
@keyframes raypulse{from{opacity:.45}to{opacity:.95}}
.moon{position:absolute;right:6vw;top:calc(env(safe-area-inset-top,0px) + 6vh);width:clamp(80px,20vw,120px);height:clamp(80px,20vw,120px);animation:moonf 5s ease-in-out infinite}
.moon svg{position:relative;width:100%;height:100%;overflow:visible}
.moon::before{content:"";position:absolute;inset:-75%;background:radial-gradient(circle,rgba(255,244,190,.7),rgba(255,244,190,0) 62%)}
@keyframes moonf{50%{transform:translateY(8px) rotate(4deg)}}
.cloud{box-shadow:0 7px 0 rgba(255,150,210,.35)}
.cloud,.cloud::before,.cloud::after{background:#ffe9f6}
.castle{position:absolute;left:1vw;bottom:22vh;width:min(50vw,300px);filter:drop-shadow(0 6px 10px rgba(110,70,170,.3))}
.castle svg{display:block;width:100%}
.win{animation:winkle 3.2s ease-in-out infinite}
.win:nth-of-type(2n){animation-delay:-1.1s}.win:nth-of-type(3n){animation-delay:-2.2s}
@keyframes winkle{0%,100%{opacity:1}50%{opacity:.45}}
.mist{position:absolute;left:-10%;right:-10%;bottom:12vh;height:14vh;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.6),rgba(255,255,255,0) 70%);filter:blur(4px);animation:mist 14s ease-in-out infinite alternate}
.mist.m2{bottom:3vh;height:11vh;animation-duration:19s;animation-direction:alternate-reverse;opacity:.8}
@keyframes mist{to{transform:translateX(7vw)}}
.tree{position:absolute;transform-origin:50% 100%;animation:sway2 6s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(90,60,140,.25))}
.tree:nth-of-type(odd){animation-delay:-3s}
.tree svg,.mush svg{display:block;width:100%}
.tree .lights{animation:winkle 2s ease-in-out infinite alternate}
@keyframes sway2{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.mush{position:absolute;transform-origin:50% 100%;animation:sway2 5s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(120,60,100,.28))}
.garland{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);height:70px}
.garland svg{position:absolute;left:0;top:0;width:100%;height:56px}
.bulb{position:absolute;width:13px;height:17px;margin-left:-6px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--c);box-shadow:0 0 12px 5px var(--c);animation:bulbtw 2.2s ease-in-out infinite alternate}
.bulb::before{content:"";position:absolute;left:4px;top:-5px;width:5px;height:6px;border-radius:2px;background:#c9a063}
@keyframes bulbtw{from{opacity:.55;filter:brightness(.9)}to{opacity:1;filter:brightness(1.3)}}
.spark{text-shadow:0 0 8px #fff,0 0 14px currentColor}
.fly{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px 4px var(--c);animation:flyf var(--d) ease-in-out infinite alternate,flick 2s ease-in-out infinite}
@keyframes flyf{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
@keyframes flick{50%{opacity:.25}}
.bf{position:absolute;left:-60px;animation:btravel linear infinite}
@keyframes btravel{to{transform:translateX(calc(100vw + 120px))}}
.bb{display:block;animation:bbob ease-in-out infinite alternate}
@keyframes bbob{from{transform:translateY(-26px)}to{transform:translateY(26px)}}
.bw{display:block;animation:bflap .28s ease-in-out infinite alternate;filter:drop-shadow(0 0 6px rgba(255,255,255,.9))}
@keyframes bflap{from{transform:scaleX(1) rotate(-8deg)}to{transform:scaleX(.35) rotate(8deg)}}
.flower{filter:drop-shadow(0 0 7px rgba(255,255,200,.85))}

/* ---------- tối ưu cho điện thoại (màn hình dọc) ---------- */
#stage{padding-top:calc(env(safe-area-inset-top,0px) + 46px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 124px)}
#bubble{max-width:min(90vw,430px);min-height:84px;padding:14px 20px}
#line{font-size:clamp(20px,min(5.8vw,3.7dvh),34px)}
#bear{width:min(58vw,270px,30dvh);margin-top:24px}
#btns{bottom:calc(env(safe-area-inset-bottom,0px) + 46px);flex-wrap:wrap;gap:12px 22px;padding:0 14px}
@media (max-width:430px){
  button{font-size:18px;padding:10px 22px}
  #no{font-size:15px;padding:8px 16px}
  #again{font-size:12px;padding:4px 12px}
  .castle{width:46vw;bottom:20vh}
  .moon{right:4vw}
  #btns{flex-direction:column;gap:30px}
  #stage{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 184px)}
  #yes{animation:none}
}
@media (max-width:350px){
  button{font-size:16px;padding:9px 16px}
  #no{font-size:13.5px;padding:7px 12px}
}
@media (max-height:560px){
  #stage{padding-top:calc(env(safe-area-inset-top,0px) + 38px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 160px)}
  #bubble{min-height:70px;padding:10px 16px}
  #bear{margin-top:20px}
}
</style>
</head>
<body>
<div id="scene" aria-hidden="true">
  <div class="rays"></div>
  <div class="moon"><svg viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="42" fill="#fff7d6" stroke="#ffe7a0" stroke-width="4"/>
    <circle cx="86" cy="42" r="7" fill="#ffefb0"/><circle cx="34" cy="84" r="9" fill="#ffefb0"/><circle cx="84" cy="88" r="5" fill="#ffefb0"/>
    <path d="M42 58q6 -9 12 0M66 58q6 -9 12 0" fill="none" stroke="#8a6a3a" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="38" cy="70" rx="6.5" ry="4" fill="#ff8fb0" opacity=".8"/><ellipse cx="82" cy="70" rx="6.5" ry="4" fill="#ff8fb0" opacity=".8"/>
    <path d="M53 70q7 8 14 0" fill="none" stroke="#8a6a3a" stroke-width="3.5" stroke-linecap="round"/>
  </svg></div>
  <div class="cloud" style="--s:1.6;--d:85s;--dl:-20s;top:14%;opacity:0.5"></div>
  <div class="cloud" style="--s:1.1;--d:60s;--dl:-40s;top:28%;opacity:0.45"></div>
  <div class="cloud" style="--s:2;--d:110s;--dl:-70s;top:40%;opacity:0.4"></div>
  <div class="castle"><svg viewBox="0 0 300 240">
    <g stroke="#d9a0c8" stroke-width="4" stroke-linejoin="round">
      <rect x="12" y="166" width="32" height="70" fill="#fff2f8"/><polygon points="6,168 28,124 50,168" fill="#b79cf0" stroke="#8d73d6"/>
      <rect x="256" y="166" width="32" height="70" fill="#fff2f8"/><polygon points="250,168 272,124 294,168" fill="#b79cf0" stroke="#8d73d6"/>
      <rect x="50" y="132" width="46" height="104" fill="#fff2f8"/><polygon points="44,134 73,78 102,134" fill="#f7a8d8" stroke="#d77fb8"/>
      <rect x="204" y="132" width="46" height="104" fill="#fff2f8"/><polygon points="198,134 227,78 256,134" fill="#f7a8d8" stroke="#d77fb8"/>
      <rect x="100" y="112" width="100" height="124" fill="#fff8fb"/><polygon points="92,114 150,40 208,114" fill="#b79cf0" stroke="#8d73d6"/>
    </g>
    <g stroke="#8d73d6" stroke-width="3" stroke-linecap="round"><path d="M150 40V12M73 78V54M227 78V54"/></g>
    <g fill="#ff8fc0"><polygon points="150,12 178,20 150,29"/><polygon points="73,54 97,61 73,69"/><polygon points="227,54 251,61 227,69"/></g>
    <path d="M134 236v-36a16 16 0 0132 0v36z" fill="#b79cf0" stroke="#8d73d6" stroke-width="3"/>
    <g fill="#ffe27a" stroke="#e0a940" stroke-width="2"><path class="win" d="M141 150a9 9 0 0118 0v20h-18z"/><path class="win" d="M64 168a9 9 0 0118 0v20h-18z"/><path class="win" d="M218 168a9 9 0 0118 0v20h-18z"/><circle class="win" cx="150" cy="96" r="6"/><circle class="win" cx="28" cy="190" r="5"/><circle class="win" cx="272" cy="190" r="5"/></g>
  </svg></div>
  <div class="hills">
    <svg viewBox="0 0 800 300" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdb5f2"/><stop offset="1" stop-color="#ecc9ee"/></linearGradient></defs><path d="M0 90Q140 20 300 74T620 56T800 40V300H0Z" fill="url(#gA)" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linejoin="round"/></svg>
    <svg viewBox="0 0 800 300" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fdcc4"/><stop offset="1" stop-color="#c6f0da"/></linearGradient></defs><path d="M0 150Q180 70 360 130T700 100T800 120V300H0Z" fill="url(#gB)" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linejoin="round"/></svg>
    <svg viewBox="0 0 800 300" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="gC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fcf9a"/><stop offset="1" stop-color="#9be3b6"/></linearGradient></defs><path d="M0 210Q150 150 340 200T660 180T800 190V300H0Z" fill="url(#gC)" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linejoin="round"/><path d="M0 252Q200 218 400 246T800 236V300H0Z" fill="#5cc48a" stroke="#fff" stroke-opacity=".45" stroke-width="3"/></svg>
  </div>

<script>
// ====== SỬA NỘI DUNG Ở ĐÂY ======
const CONFIG = {
  lines: [
    "Bạn à,",
    "chúng mình nói chuyện cũng được một thời gian rồi ý",
    "Không biết bạn thế nào",
    "nhưng mình thì lại thấy rất ấn tượng về bạn",
    "Nên hôm nay mình lấy hết can đảm để nói với bạn",
    "Mình muốn nghiêm túc được tìm hiểu bạn",
    "Bạn cho mình cơ hội nhé? 🥺👉👈"
  ],
  yesText: "Yeahhh!! 🥳\nCảm ơn bạn nhiều lắm!\nChụp màn hình gửi mình nha 💖",
  noTexts: ["Bạn nghĩ lại đi mà 🥺", "Đừng bấm nút này nữa ><", "Nút này hư rồi hihi 🙈", "Bấm Đồng ý đi nha 💗"]
};
// =================================
const $ = id => document.getElementById(id);
// dựng khu vườn cổ tích: dây đèn tiên, sao, đom đóm, bướm, hoa
(() => {
  const sc = $('scene'), r = Math.random;
  const gl = document.createElement('div'); gl.className = 'garland'; sc.appendChild(gl);
  const bc = ['#ffd86b','#ff9ccb','#9fe3ff','#c2a8ff','#9ff0c8','#ffb87a'];
  function build(){
    const W = innerWidth, H = 56, N = Math.max(9, Math.round(W / 54));
    gl.innerHTML = '<svg viewBox="0 0 100 20" preserveAspectRatio="none"><path d="M0 0Q50 28 100 0" fill="none" stroke="#fff3cf" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
    for (let k = 0; k < N; k++){
      const t = (k + .5) / N, y = 2 * (1 - t) * t * 28 * H / 20;
      const e = document.createElement('div'); e.className = 'bulb';
      e.style.cssText = `left:${(t * 100).toFixed(2)}%;top:${y.toFixed(1)}px;--c:${bc[k % bc.length]};animation-delay:${(-r() * 2).toFixed(2)}s`;
      gl.appendChild(e);
    }
  }
  build(); addEventListener('resize', build);
  for (let i = 0; i < 44; i++){ const s = document.createElement('span'); s.className = 'spark'; s.textContent = ['✦','✧','✦','✧','✨'][i % 5];
    s.style.cssText = `position:absolute;color:${['#fff','#fff3b0','#ffd1ec'][i % 3]};left:${r() * 98}%;top:${r() * 58}%;font-size:${8 + r() * 16}px;animation:tw ${1.8 + r() * 2}s ease-in-out ${-r() * 3}s infinite`; sc.appendChild(s); }
  const fc = ['#fff3a0','#ffd2ec','#c9f4ff','#d8ffc8'];
  for (let i = 0; i < 30; i++){ const y = document.createElement('span'); y.className = 'fly';
    y.style.cssText = `left:${r() * 96}%;top:${35 + r() * 55}%;--c:${fc[i % fc.length]};--d:${4 + r() * 5}s;--dx:${(r() - .5) * 90}px;--dy:${(r() - .5) * 90}px;animation-delay:${-r() * 4}s,${-r() * 2}s`; sc.appendChild(y); }
  for (let i = 0; i < 5; i++){ const e = document.createElement('span'); e.className = 'bf';
    e.style.cssText = `top:${14 + r() * 50}%;font-size:${22 + r() * 12}px;animation-duration:${22 + r() * 18}s;animation-delay:${-r() * 30}s`;
    e.innerHTML = `<span class="bb" style="animation-duration:${2.5 + r() * 2}s"><span class="bw">🦋</span></span>`; sc.appendChild(e); }
  const fl = ['🌷','🌸','🌼','🌺','🍄','🌻','🌷','🌸'];
  for (let i = 0; i < 18; i++){ const f = document.createElement('span'); f.className = 'flower'; f.textContent = fl[i % fl.length];
    f.style.cssText = `position:absolute;left:${(i + r() * .8) * 5.5}%;bottom:${1 + r() * 14}vh;font-size:${22 + r() * 18}px;animation:sway 3s ease-in-out ${-r() * 3}s infinite;transform-origin:50% 100%`; sc.appendChild(f); }
})();
const cv = $('fx'), c = cv.getContext('2d'), line = $('line'), bubble = $('bubble'), bear = $('bear'), stage = $('stage'),
  again = $('again'), btns = $('btns'), yes = $('yes'), no = $('no');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const F = 520, R = Math.random, EF = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const EM = ['🐱','🐻','🐰','🐹','🐸','🦦','🧸','🍓','🌸','💌','🫶','✨','🥰','🍡','☁️','🐥','🍑','🎀','🧋','🐼','🐶','🦆','💖','🍰','🌈','⭐','💗','🐷'];
const BUB = ['uwu','hehe','owo','iu iu 🥰','👉👈','ehe~','bẹp bẹp','☺','nhaaa','♡'];
let W, H, dpr, items = [], bokeh = [], pops = [], running = 0, tx = 0, ty = 0, cx = 0, cy = 0, lastInput = -1e9, noCount = 0, yesScale = 1;

const glow = (() => { const s = document.createElement('canvas'); s.width = s.height = 64; const g = s.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,.95)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0,0,64,64); return s; })();

function P(x, y, z, ry, rx){
  const cr = Math.cos(ry), sr = Math.sin(ry), a = Math.cos(rx), b = Math.sin(rx);
  let X = x * cr + z * sr, Z = -x * sr + z * cr, Y = y * a - Z * b; Z = y * b + Z * a;
  const d = F + Z; if (d < 40) return null;
  const k = F / d; return { x: W / 2 + X * k, y: H / 2 + Y * k, k, z: Z };
}
function resize(){
  const pw = W;
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (items.length && pw === W) return; // thanh địa chỉ trình duyệt co giãn: không dựng lại, tránh giật
  const n = Math.round(Math.min(46, Math.max(24, W * H / 15000)));
  items = Array.from({length: n}, (_, i) => ({ t: i % 6 === 5 ? BUB[(R() * BUB.length) | 0] : EM[(R() * EM.length) | 0], bub: i % 6 === 5,
    x: (R() - .5) * 2200, y: (R() - .5) * 1500, z: -250 + R() * 1300, s: .8 + R() * .7, ph: R() * 6.28, vy: .15 + R() * .35, vx: (R() - .5) * .3 })).sort((a, b) => b.z - a.z);
  bokeh = Array.from({length: 16}, () => ({ x: (R() - .5) * 2400, y: (R() - .5) * 1600, z: 200 + R() * 1400, r: 90 + R() * 160, a: .25 + R() * .35, ph: R() * 6.28 }));
}
addEventListener('resize', resize); resize();

function burst(x, y, n = 10, set = EM){
  for (let i = 0; i < n; i++){ const a = R() * 6.28, v = 3 + R() * 6;
    pops.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5, e: set[(R() * set.length) | 0], s: 26 + R() * 24, r: R() * 6.28, vr: (R() - .5) * .3, life: 1.2 }); }
}
function tilt(e){ lastInput = performance.now(); tx = (e.clientX / W - .5) * 2; ty = (e.clientY / H - .5) * 2; }
addEventListener('pointermove', tilt);
addEventListener('pointerdown', e => { tilt(e); if (e.target.closest('button')) return; burst(e.clientX, e.clientY, 9); });
addEventListener('deviceorientation', e => {
  if (e.gamma == null) return; lastInput = performance.now();
  tx = Math.max(-1, Math.min(1, e.gamma / 30)); ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
});

function pill(x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

function frame(t){
  if (t - lastInput > 3000){ tx = Math.sin(t / 3500) * .6; ty = Math.cos(t / 4200) * .35; }
  cx += (tx - cx) * .05; cy += (ty - cy) * .05;
  const ry = cx * .35, rx = -cy * .22;
  stage.style.transform = `perspective(900px) rotateY(${(cx * 6).toFixed(2)}deg) rotateX(${(-cy * 4).toFixed(2)}deg)`;
  c.clearRect(0, 0, W, H); c.textAlign = 'center'; c.textBaseline = 'middle';

  for (const b of bokeh){ const p = P(b.x, b.y + Math.sin(t / 2500 + b.ph) * 40, b.z, ry, rx); if (!p) continue;
    const s = b.r * p.k; c.globalAlpha = b.a; c.drawImage(glow, p.x - s, p.y - s, s * 2, s * 2); }

  for (const o of items){
    o.y -= o.vy; o.x += o.vx; if (o.y < -900){ o.y = 900; o.x = (R() - .5) * 2200; }
    const p = P(o.x + Math.sin(t / 1300 + o.ph) * 30, o.y + Math.sin(t / 900 + o.ph) * 22, o.z, ry, rx); if (!p) continue;
    const size = 54 * o.s * p.k, rot = Math.sin(t / 1100 + o.ph) * .3;
    c.save(); c.translate(p.x, p.y); c.rotate(rot); c.globalAlpha = Math.min(1, p.k * 1.3);
    if (o.bub){
      c.font = `800 ${(size * .62).toFixed(1)}px "Baloo 2",${EF}`; const w = c.measureText(o.t).width + size * .6, h = size * .95;
      c.fillStyle = '#fff'; c.shadowColor = 'rgba(214,84,142,.35)'; c.shadowBlur = 10; pill(-w / 2, -h / 2, w, h, h / 2); c.fill(); c.shadowBlur = 0;
      c.fillStyle = '#d6548e'; c.fillText(o.t, 0, 2);
    } else { c.font = `${size.toFixed(1)}px ${EF}`; c.fillText(o.t, 0, 0); }
    c.restore();
  }

  for (const q of pops){ q.x += q.vx; q.y += q.vy; q.vy += .25; q.r += q.vr; q.life -= .015;
    c.save(); c.translate(q.x, q.y); c.rotate(q.r); c.globalAlpha = Math.max(0, Math.min(1, q.life)); c.font = `${q.s}px ${EF}`; c.fillText(q.e, 0, 0); c.restore(); }
  pops = pops.filter(q => q.life > 0); c.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- gõ chữ trong bong bóng ----------
async function type(text, ok){
  line.textContent = '';
  // dựng sẵn cả câu (ẩn) theo từng từ nguyên khối => không ngắt giữa từ, không nhảy dòng khi gõ
  const spans = []; let word = null;
  for (const ch of [...text]){
    if (ch === '\n'){ line.appendChild(document.createElement('br')); word = null; continue; }
    if (ch === ' '){ line.appendChild(document.createTextNode(' ')); word = null; continue; }
    if (!word){ word = document.createElement('span'); word.className = 'w'; line.appendChild(word); }
    const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch; word.appendChild(s); spans.push(s);
  }
  bear.classList.add('talk');
  for (const s of spans){
    if (!ok()) return;
    s.classList.add('show');
    await sleep(/[,?!]/.test(s.textContent) ? 160 : 48);
  }
  bear.classList.remove('talk');
}
async function say(text, ok, hold){
  bubble.classList.add('on'); await type(text, ok); if (!ok()) return;
  await sleep(hold); bubble.classList.remove('on'); await sleep(550);
}
async function play(){
  const id = ++running, ok = () => id === running;
  again.classList.remove('on'); btns.classList.remove('on'); bear.classList.remove('happy','talk');
  const sp = $('nospacer'); if (sp) sp.remove();
  no.classList.remove('run'); no.style.left = no.style.top = ''; noCount = 0; yesScale = 1; yes.style.transform = ''; no.textContent = 'Để mình nghĩ 🙈';
  bubble.classList.remove('on'); line.textContent = '';
  await sleep(900); if (!ok()) return;
  const last = CONFIG.lines.length - 1;
  for (let i = 0; i < last; i++){ await say(CONFIG.lines[i], ok, 900 + CONFIG.lines[i].length * 22); if (!ok()) return; }
  bubble.classList.add('on'); await type(CONFIG.lines[last], ok); if (!ok()) return;
  burst(W / 2, H * .35, 8, ['💗','✨','🥺','💖']);
  btns.classList.add('on'); again.classList.add('on');
}

// ---------- nút ----------
let lastDodge = 0;
function dodge(){
  lastDodge = performance.now();
  noCount++;
  if (!no.classList.contains('run')){ // giữ chỗ để nút Đồng ý không bị xô dịch khi nút kia bay đi
    const sp = document.createElement('span'); sp.id = 'nospacer';
    sp.style.cssText = `display:block;flex:none;width:${no.offsetWidth}px;height:${no.offsetHeight}px`;
    no.parentNode.insertBefore(sp, no);
  }
  no.classList.add('run');
  const bw = no.offsetWidth, bh = no.offsetHeight, m = 12, yr = yes.getBoundingClientRect();
  let nx, ny;
  for (let k = 0; k < 20; k++){ // chọn chỗ không đè lên nút "Đồng ý"
    nx = m + R() * Math.max(0, W - bw - m * 2); ny = m + R() * Math.max(0, H - bh - m * 2);
    if (nx > yr.right + 8 || nx + bw < yr.left - 8 || ny > yr.bottom + 8 || ny + bh < yr.top - 8) break;
  }
  no.style.left = nx + 'px'; no.style.top = ny + 'px';
  no.textContent = CONFIG.noTexts[(noCount - 1) % CONFIG.noTexts.length];
  yesScale = Math.min(W < 480 ? 1 : 1.7, yesScale + .1); yes.style.transform = `scale(${yesScale})`;
  bear.classList.add('talk'); setTimeout(() => bear.classList.remove('talk'), 400);
  burst(bw / 2 + parseFloat(no.style.left), bh / 2 + parseFloat(no.style.top), 4, ['💔','🥺','💦']);
}
no.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') dodge(); }); // cảm ứng chỉ né khi chạm, tránh đếm 2 lần
no.addEventListener('pointerdown', e => { e.preventDefault(); if (e.pointerType === 'mouse') dodge(); });
no.addEventListener('click', e => e.preventDefault());
no.addEventListener('touchstart', e => { e.preventDefault(); dodge(); }, { passive: false }); // chặn click giả sau khi chạm

yes.addEventListener('click', async e => {
  if (performance.now() - lastDodge < 900) { e.preventDefault(); return; } // cú chạm "rơi" sang nút Đồng ý sau khi nút kia né
  if (e.detail){ // chỉ nhận khi chạm vào phần lõi của nút (chừa lề 12px)
    const r = yes.getBoundingClientRect(), m = 12;
    if (e.clientX < r.left + m || e.clientX > r.right - m || e.clientY < r.top + m || e.clientY > r.bottom - m) return;
  }
  running++; const id = running, ok = () => id === running;
  btns.classList.remove('on'); bear.classList.add('happy');
  for (let k = 0; k < 6; k++) setTimeout(() => burst(R() * W, H * (.2 + R() * .5), 14, ['💖','💗','🎉','✨','🌸','🥰','🎀','🍓','💕']), k * 280);
  bubble.classList.add('on'); await type(CONFIG.yesText, ok);
  again.classList.add('on');
});

$('go').addEventListener('click', () => {
  $('bgm').play().catch(() => {});
  const s = $('start'); s.style.opacity = 0; s.style.pointerEvents = 'none'; setTimeout(() => s.remove(), 800); play();
});
again.addEventListener('click', () => { const a = $('bgm'); a.currentTime = 0; a.play().catch(() => {}); play(); });
</script>
